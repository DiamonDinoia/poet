name: Build Single Header

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history and tags: GenerateVersion.cmake derives the version from
          # `git describe`, which sees nothing under the default depth-1 fetch.
          fetch-depth: 0
      - run: sudo apt-get install python3
      # version.hpp is generated, not tracked, and poet.hpp includes it.
      - name: Generate version header
        run: cmake -P cmake/GenerateVersion.cmake
      - name: Generate single header to temp file
        run: python3 tools/amalgamate.py --root . --input include/poet/poet.hpp --output /tmp/poet.hpp
      - name: Check the single header stands alone
        run: |
          printf '#include "/tmp/poet.hpp"\nint main(){return 0;}\n' > /tmp/sh_check.cpp
          g++ -std=c++20 -fsyntax-only /tmp/sh_check.cpp
      - name: Checkout single-header branch
        uses: actions/checkout@v6
        with:
          ref: single-header
          fetch-depth: 0

      - name: Place generated header
        run: |
          mv /tmp/poet.hpp poet.hpp
          git add poet.hpp || true
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: single-header
          commit_message: Update single-header build.
